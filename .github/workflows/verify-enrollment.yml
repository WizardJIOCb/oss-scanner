name: Verify OSS enrollment environments
'on':
  workflow_dispatch:
    inputs:
      matrix:
        description: JSON project matrix for this one-time verification
        required: true
        default: '[{"name":"xedoc.ru","branch":"enroll/xedoc-ru","tests":["pnpm typecheck","node --input-type=module -e \"import
          { DatabaseSync } from ''node:sqlite''; const db = new DatabaseSync('':memory:''); console.log(db.prepare(''SELECT
          1 AS ok'').get()); db.close();\""]},{"name":"play.xedoc.ru","branch":"enroll/play-xedoc-ru","tests":["npm run test","python
          -m pytest -q backend/tests"]},{"name":"aw.xedoc.ru","branch":"enroll/aw-xedoc-ru","tests":["npm run test"]},{"name":"bee.xedoc.ru","branch":"enroll/bee-xedoc-ru","tests":["npm
          run test"]},{"name":"brain.xedoc.ru","branch":"enroll/brain-xedoc-ru","tests":["pnpm run test"]},{"name":"bullet.xedoc.ru","branch":"enroll/bullet-xedoc-ru","tests":["npm
          run test"]},{"name":"carmageddon.xedoc.ru","branch":"enroll/carmageddon-xedoc-ru","tests":[]},{"name":"channel.xedoc.ru","branch":"enroll/channel-xedoc-ru","tests":[]},{"name":"city.xedoc.ru","branch":"enroll/city-xedoc-ru","tests":["npm
          run test"]},{"name":"civi.xedoc.ru","branch":"enroll/civi-xedoc-ru","tests":["npm run test"]},{"name":"cloud.xedoc.ru","branch":"enroll/cloud-xedoc-ru","tests":[]},{"name":"codex.xedoc.ru","branch":"enroll/codex-xedoc-ru","tests":[]},{"name":"colors.xedoc.ru","branch":"enroll/colors-xedoc-ru","tests":["npm
          run test"]},{"name":"doom.xedoc.ru","branch":"enroll/doom-xedoc-ru","tests":[]},{"name":"eng.xedoc.ru","branch":"enroll/eng-xedoc-ru","tests":["npm
          run test"]},{"name":"hands.xedoc.ru","branch":"enroll/hands-xedoc-ru","tests":[]},{"name":"hermes.xedoc.ru","branch":"enroll/hermes-xedoc-ru","tests":["pytest
          -q tests/agent/test_redact.py tests/cli/test_worktree_security.py tests/gateway/test_session_boundary_security_state.py
          --maxfail=5"]},{"name":"icq.xedoc.ru","branch":"enroll/icq-xedoc-ru","tests":[]},{"name":"images.xedoc.ru","branch":"enroll/images-xedoc-ru","tests":[]},{"name":"kick.xedoc.ru","branch":"enroll/kick-xedoc-ru","tests":[]},{"name":"models.xedoc.ru","branch":"enroll/models-xedoc-ru","tests":["go
          test ./demo","ctest --test-dir build-cpu --output-on-failure -R \"kimodo-(diffusion|converter)-test\""]},{"name":"music.xedoc.ru","branch":"enroll/music-xedoc-ru","tests":[]},{"name":"needle.xedoc.ru","branch":"enroll/needle-xedoc-ru","tests":["npm
          run test"]},{"name":"papper.xedoc.ru","branch":"enroll/papper-xedoc-ru","tests":[]},{"name":"projects.xedoc.ru","branch":"enroll/projects-xedoc-ru","tests":[]},{"name":"quest.xedoc.ru","branch":"enroll/quest-xedoc-ru","tests":["npm
          run test"]},{"name":"rage.xedoc.ru","branch":"enroll/rage-xedoc-ru","tests":[]},{"name":"supadrupapp.xedoc.ru","branch":"enroll/supadrupapp-xedoc-ru","tests":[]},{"name":"tekken.xedoc.ru","branch":"enroll/tekken-xedoc-ru","tests":[]},{"name":"tekkenf.xedoc.ru","branch":"enroll/tekkenf-xedoc-ru","tests":[]},{"name":"tg.xedoc.ru","branch":"enroll/tg-xedoc-ru","tests":[]},{"name":"top.xedoc.ru","branch":"enroll/top-xedoc-ru","tests":[]},{"name":"video.xedoc.ru","branch":"enroll/video-xedoc-ru","tests":["npm
          run test:run","npm run headless:test:node"]},{"name":"voice.xedoc.ru","branch":"enroll/voice-xedoc-ru","tests":[]},{"name":"wizard.xedoc.ru","branch":"enroll/wizard-xedoc-ru","tests":[]},{"name":"ytc.xedoc.ru","branch":"enroll/ytc-xedoc-ru","tests":[]}]'
permissions:
  contents: read
concurrency:
  group: oss-enrollment-verification-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  verify:
    name: ${{ matrix.project.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        project: ${{ fromJSON(inputs.matrix) }}
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ matrix.project.branch }}
        persist-credentials: false
    - name: Install validator dependency
      run: python3 -m pip install PyYAML
    - name: Validate enrollment
      run: python3 tools/validate.py
    - name: Build official offline environment
      run: python3 tools/check "${{ matrix.project.name }}" --no-shell --dir "$RUNNER_TEMP/oss-enrollment/${{ matrix.project.name
        }}"
    - name: Run applicable tests offline
      env:
        PROJECT_NAME: ${{ matrix.project.name }}
        OFFLINE_TESTS: ${{ toJSON(matrix.project.tests) }}
      run: "python3 - <<'PY'\nimport json, os, subprocess\ncommands = json.loads(os.environ[\"OFFLINE_TESTS\"])\nname = os.environ[\"\
        PROJECT_NAME\"]\nfailed = []\nfor index, command in enumerate(commands):\n    print(f\"Offline test: {command}\",\
        \ flush=True)\n    args = [\"docker\", \"run\", \"--rm\", \"--network=none\", \"--cpus=2\", \"--memory=6g\", \"-e\"\
        , \"CI=true\", \"-w\", \"/src\", f\"oss-scanner-check/built:{name}\", \"timeout\", \"300\", \"bash\", \"-c\", command]\n\
        \    result = subprocess.run(args, timeout=330)\n    if result.returncode:\n        failed.append((command, result.returncode))\n\
        with open(os.environ[\"GITHUB_STEP_SUMMARY\"], \"a\") as summary:\n    summary.write(f\"## {name}\\nOfficial build\
        \ completed. Offline test commands: {len(commands)}; failures: {len(failed)}.\\n\")\nif failed:\n    print(failed)\n\
        \    raise SystemExit(1)\nPY\n"
